<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS - Weekly Technical Challenge</title>
    <link rel="stylesheet" href="../../styles/weeklyTechnicalChallenge.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#ffffff",
              accent: "#139a43",
              dark: "#000000",
              light: "#e0e0e0",
              lighter: "#a0a0a0",
              card: "#1e1e1e",
            },
            fontFamily: {
              sans: ["Poppins", "sans-serif"],
            },
            animation: {
              "fade-in-up": "fadeInUp 0.6s ease forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <section id="hero">
      <!-- Member 1 -->
       <div class="hero-section">
        <div class="weekly-button">
          <button>WEEKLY CHALLENGE</button>
        </div>

        <h1 class="hero_text" style="margin-top: 20px;">Weekly</h1>
        <h1 style="color: #32D74B;" class="hero_text">Technical</h1> 
        <h1 class="hero_text">Challenge</h1>
        
        <p class="slogan">Sharpen Your Skills. Compete. Learn. Grow.</p>

          <div class="info_card">
            <div class="date">
            <i class="fa-regular fa-calendar calender" style="color: rgb(50, 215, 75);"></i>
            <pre class="date_info">New Challenge
Every Saturday</pre>
            </div>

            <div class="solutions">
              <i class="fa-solid fa-trophy trophy" style="color: rgb(50, 215, 75);"></i>
              <pre class="solutions_info">Top 2-3 Solution
Featured Weekly
              </pre>
            </div>

            <div class="leaderboard">
              <i class="fa-solid fa-ranking-star ranking" style="color: rgb(50, 215, 75);"></i>
              <pre class="leaderboard_info">Monthly Leaderboard
& Rewards
              </pre>
            </div>

          </div>
       </div>
    </section>

    <section id="domains">
      <!-- Member 2 -->
    </section>

    <section class="info-section">
      <div class="how-it-works">
        <!-- How It Works content -->
      </div>

      <div class="points-system">
        <!-- Points System content -->
      </div>
    </section>

    <section class="leaderboard-banner">
      <div class="leaderboard-icon">
        <!-- Trophy Icon -->
      </div>

      <div class="leaderboard-content"></div>
    </section>

    <section id="faq">
      <!-- Member 3 -->
    </section>

    <footer>
      <!-- Member 4 -->
    </footer>
    <div id="footer-placeholder"></div>

    <!-- Component loaders -->
    <script src="/components/navbar.js"></script>
    <script src="/components/footer.js"></script>
  </body>
</html>
